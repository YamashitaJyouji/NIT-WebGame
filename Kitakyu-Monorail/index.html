<title>小倉貫通！モノレール・ダッシュ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: a 9:16 stage (WebGL canvas under a 2D HUD canvas), centered and scaled to fit. Single dark look by choice. */
:root { --bg: #070c19; --ink: #eaf2ff; --frame: #1b2c52; --accent: #ffb21a; color-scheme: dark; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; display: flex; background: var(--bg); color: var(--ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#wrap { flex: 1; min-width: 0; min-height: 0; position: relative; }
#stage {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border-radius: 14px; overflow: hidden; background: #050a18;
  box-shadow: 0 0 0 2px var(--frame), 0 12px 40px rgba(0, 0, 0, 0.55);
}
#stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#hud:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
#fatal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font: 700 15px/1.7 "Zen Kaku Gothic New", sans-serif; color: #ffe9a8; background: rgba(5,10,24,.92); }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="hud" tabindex="0" aria-label="小倉貫通！モノレール・ダッシュ。画面を長押しして、離すと発車します。"></canvas>
    <div id="fatal"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game-data.js"></script>
<script>
(() => {
'use strict';

/* ==========================================================================
   0. DATA  ―  game-data.js から読み込む（数値・駅・名所・文言はすべてそちら）
   ========================================================================== */
const fatal = (msg) => { const f = document.getElementById('fatal'); f.textContent = msg; f.style.display = 'flex'; };
const DATA = window.MONORAIL_DATA;
if (!DATA) { fatal('game-data.js を読み込めませんでした。同じ場所に置いてください。'); return; }
if (!window.THREE) { fatal('3Dライブラリ（three.js）を読み込めませんでした。通信状況を確認して再読み込みしてください。'); return; }
const T = window.THREE;

const W = 360, H = 640;
const STATIONS = DATA.stations.map((s) => Object.assign({}, s, { m: Math.round(s.km * 1000) }));
const LAST = STATIONS[STATIONS.length - 1];
const TRACK_Y = 14;                                   // 高架の高さ[m]（演出用）
const TRAIN_LEN = DATA.train.lengthM;                 // 60.47 m（実車）
const END_X = LAST.m + TRAIN_LEN / 2 + DATA.run.endBufferM;   // 終端の車止め位置[m]
const FONT_D = '"Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif';
const FONT_B = '"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif';
const DISP = { font: FONT_D, weight: 400 };

/* ==========================================================================
   1. UTIL
   ========================================================================== */
const U = {
  clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: (a, b, x) => { const t = U.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); },
  rand: (a, b) => a + Math.random() * (b - a),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  seeded: (seed) => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; },
  fmt: (n) => Math.round(n).toLocaleString('ja-JP'),
  sign: (n, d = 1) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(d),
  // 実距離の表示（1km以上は km、100m以上は整数 m、それ未満は小数 m）
  dist: (m) => { const a = Math.abs(m); return a >= 1000 ? (a / 1000).toFixed(2) + ' km' : a >= 100 ? Math.round(a) + ' m' : a.toFixed(1) + ' m'; },
  km1: (m) => (m / 1000).toFixed(1) + ' km',
};

/* ==========================================================================
   2. GFX  ―  2D（HUD）描画ヘルパー
   ========================================================================== */
const Gfx = {
  rr(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  },
  text(g, s, x, y, o = {}) {
    const { size = 16, font = FONT_B, weight = 700, align = 'left', color = '#fff', stroke = null, strokeW = 4, alpha = 1, base = 'alphabetic' } = o;
    g.save(); g.globalAlpha *= alpha;
    g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = base;
    if (stroke) { g.lineJoin = 'round'; g.lineWidth = strokeW; g.strokeStyle = stroke; g.strokeText(s, x, y); }
    g.fillStyle = color; g.fillText(s, x, y); g.restore();
  },
  fit(g, s, maxW, size, font, weight) {
    g.save(); g.font = `${weight} ${size}px ${font}`; const w = g.measureText(s).width; g.restore();
    return w > maxW ? size * maxW / w : size;
  },
};

/* ==========================================================================
   3. FX  ―  HUD 上のパーティクル（花火・火花・煙・紙吹雪）と画面フラッシュ
   ========================================================================== */
const FX = {
  list: [],
  clear() { this.list.length = 0; },
  add(p) { if (this.list.length > 700) return; this.list.push(Object.assign({ kind: 'dot', life: 1, age: 0, x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, size: 3, color: '#fff', rot: 0, vr: 0 }, p)); },
  firework(x, y, color) {
    const n = 44;
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n + Math.random() * 0.12, sp = U.rand(60, 170); this.add({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 90, drag: 1.3, life: U.rand(0.8, 1.5), size: 2.2, color }); }
    this.add({ kind: 'ring', x, y, life: 0.45, size: 46, color });
  },
  confetti(n, y0) {
    const cols = ['#6dffb8', '#ffd24a', '#8fdcff', '#ff8fb0', '#ffffff'];
    for (let i = 0; i < n; i++) this.add({ kind: 'conf', x: U.rand(0, W), y: y0 - U.rand(0, 40), vx: U.rand(-30, 30), vy: U.rand(40, 120), g: 40, life: U.rand(1.6, 2.6), size: U.rand(4, 7), color: U.pick(cols), vr: U.rand(-9, 9) });
  },
  sparks(x, y, n, dirX, color = '#ffcf6a') {
    for (let i = 0; i < n; i++) this.add({ kind: 'spark', x, y, vx: dirX * U.rand(30, 180) + U.rand(-40, 40), vy: U.rand(-150, -20), g: 520, life: U.rand(0.25, 0.7), size: 1.8, color });
  },
  smoke(x, y, n) { for (let i = 0; i < n; i++) this.add({ kind: 'smoke', x: x + U.rand(-8, 8), y, vx: U.rand(-20, 20), vy: U.rand(-40, -10), life: U.rand(0.8, 1.4), size: U.rand(6, 12), color: '#cfd6e6' }); },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i]; p.age += dt;
      if (p.age >= p.life) { this.list.splice(i, 1); continue; }
      p.vy += p.g * dt;
      if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
  },
  draw(g) {
    g.save();
    for (const p of this.list) {
      const k = p.age / p.life, a = 1 - k;
      if (p.kind === 'spark') { g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.strokeStyle = p.color; g.lineWidth = p.size; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045); g.stroke(); }
      else if (p.kind === 'ring') { g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.strokeStyle = p.color; g.lineWidth = 3 * a + 1; g.beginPath(); g.arc(p.x, p.y, p.size * (0.2 + k), 0, Math.PI * 2); g.stroke(); }
      else if (p.kind === 'smoke') { g.globalCompositeOperation = 'source-over'; g.globalAlpha = 0.35 * a; g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.size * (1 + k * 1.8), 0, Math.PI * 2); g.fill(); }
      else if (p.kind === 'conf') { g.globalCompositeOperation = 'source-over'; g.globalAlpha = Math.min(1, a * 1.6); g.fillStyle = p.color; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); g.restore(); }
      else { g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.size, 0, Math.PI * 2); g.fill(); }
    }
    g.restore();
  },
};

const Flash = {
  a: 0, color: '#fff', decay: 4,
  hit(color = '#fff', a = 1, decay = 4) { this.color = color; this.a = a; this.decay = decay; },
  update(dt) { this.a = Math.max(0, this.a - this.decay * dt); },
  draw(g) { if (this.a > 0.005) { g.save(); g.globalAlpha = this.a; g.fillStyle = this.color; g.fillRect(0, 0, W, H); g.restore(); } },
};

/* ==========================================================================
   4. SOUND  ―  WebAudio 合成（素材ファイル不要）
   ========================================================================== */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null, ch: null,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* ignore */ } }
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; if (m) this.chargeStop(); },
  tone(freq, dur, o = {}) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (o.delay || 0), osc = this.ctx.createOscillator(), gn = this.ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gn); gn.connect(this.master); osc.start(t0); osc.stop(t0 + dur + 0.03);
  },
  noise(dur, o = {}) {
    if (!this.ctx || this.muted || !this.noiseBuf) return;
    const t0 = this.ctx.currentTime + (o.delay || 0), src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f0 || 1000, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f1 || o.f0 || 1000), t0 + dur);
    const gn = this.ctx.createGain(); gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(gn); gn.connect(this.master); src.start(t0); src.stop(t0 + dur + 0.03);
  },
  chargeStart() {
    if (!this.ctx || this.muted || this.ch) return;
    const osc = this.ctx.createOscillator(), f = this.ctx.createBiquadFilter(), gn = this.ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = 70; f.type = 'lowpass'; f.frequency.value = 400; gn.gain.value = 0.0001;
    osc.connect(f); f.connect(gn); gn.connect(this.master); osc.start();
    gn.gain.exponentialRampToValueAtTime(0.07, this.ctx.currentTime + 0.1);
    this.ch = { osc, f, gn };
  },
  chargeSet(p) {
    if (!this.ch) return; const t = this.ctx.currentTime;
    this.ch.osc.frequency.setTargetAtTime(70 + p * 280, t, 0.05); this.ch.f.frequency.setTargetAtTime(300 + p * 2400, t, 0.05); this.ch.gn.gain.setTargetAtTime(0.05 + p * 0.09, t, 0.05);
  },
  chargeStop() {
    if (!this.ch) return; const c = this.ch; this.ch = null; const t = this.ctx.currentTime;
    try { c.gn.gain.cancelScheduledValues(t); c.gn.gain.setTargetAtTime(0.0001, t, 0.03); c.osc.stop(t + 0.2); } catch (e) { /* ignore */ }
  },
  launch() {
    this.noise(0.2, { type: 'highpass', f0: 3600, f1: 900, gain: 0.5 });
    this.noise(0.9, { type: 'bandpass', f0: 500, f1: 3200, gain: 0.35, delay: 0.03 });
    this.tone(190, 0.5, { type: 'sawtooth', slide: 0.3, gain: 0.2 });
  },
  brake(sec, loud) { this.noise(sec, { type: 'bandpass', f0: 2800, f1: 1300, gain: loud ? 0.2 : 0.1 }); this.tone(900, sec, { type: 'square', slide: 0.8, gain: loud ? 0.035 : 0.02 }); },
  result(id) {
    if (id === 'PERFECT') { [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 0.28, { type: 'triangle', gain: 0.18, delay: i * 0.09 })); [0.1, 0.35, 0.6, 0.85].forEach((d) => this.noise(0.2, { type: 'highpass', f0: 4000, f1: 1800, gain: 0.12, delay: d })); }
    else if (id === 'GREAT') { [660, 880, 990].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', gain: 0.17, delay: i * 0.09 })); }
    else if (id === 'GOOD') { [620, 780].forEach((f, i) => this.tone(f, 0.22, { type: 'triangle', gain: 0.15, delay: i * 0.1 })); }
    else { this.tone(170, 0.55, { type: 'sawtooth', slide: 0.5, gain: 0.2 }); this.noise(0.4, { type: 'lowpass', f0: 800, f1: 200, gain: 0.3 }); }
  },
  crash() { this.noise(0.8, { type: 'lowpass', f0: 1400, f1: 120, gain: 0.5 }); this.tone(90, 0.6, { type: 'sawtooth', slide: 0.4, gain: 0.25 }); },
};

/* ==========================================================================
   5. STATE & RULES  ―  ゲーム状態 / 判定 / 採点（距離は実距離[m]）
   ========================================================================== */
const Judgement = {
  evaluate(err, derailed) {
    const a = Math.abs(err);
    for (const j of DATA.judge) if (a <= j.tol) return Object.assign({ ok: true }, j);
    const f = err > 0 ? DATA.fail.over : DATA.fail.short;
    return Object.assign({ ok: false, score: 0, tol: 0 }, f, derailed ? { sub: DATA.fail.derailSub } : {});
  },
};

const State = {
  round: 0, score: 0, combo: 0, results: [], targets: [], best: 0, newRecord: false,
  loadBest() { try { this.best = parseInt(localStorage.getItem(DATA.storageKey) || '0', 10) || 0; } catch (e) { this.best = 0; } },
  saveBest() { try { localStorage.setItem(DATA.storageKey, String(this.best)); } catch (e) { /* ignore */ } },
  pickTargets(n) {
    const cand = STATIONS.filter((s) => s.m > 0).sort((a, b) => a.m - b.m), out = [];
    for (let i = 0; i < n; i++) {
      const a = Math.floor(i * cand.length / n), b = Math.max(a + 1, Math.floor((i + 1) * cand.length / n));
      out.push(U.pick(cand.slice(a, b)));
    }
    return out;
  },
  reset() { this.round = 0; this.score = 0; this.combo = 0; this.results = []; this.newRecord = false; this.targets = this.pickTargets(DATA.rounds); },
  get target() { return this.targets[this.round]; },
  record(j, err) {
    const t = this.target;
    this.combo = j.ok ? this.combo + 1 : 0;
    const mult = 1 + DATA.score.distanceBonusMax * (t.m / LAST.m);
    const base = Math.round(j.score * mult), bonus = j.ok ? (this.combo - 1) * DATA.score.comboBonus : 0, pts = base + bonus;
    this.score += pts;
    this.results.push({ station: t.name, judge: j, err, pts, base: j.score });
    return { pts, combo: this.combo, mult };
  },
  finish() { this.newRecord = this.score > this.best; if (this.newRecord) { this.best = this.score; this.saveBest(); } },
  rankInfo() {
    const n = this.results.length || 1;
    const ratio = this.results.reduce((s, r) => s + r.base, 0) / (n * DATA.judge[0].score);
    return DATA.rank.find((r) => ratio >= r.min) || DATA.rank[DATA.rank.length - 1];
  },
};

/* ---- パワーゲージ：目標駅まわりだけ「±zoneM」を拡大し、そこでカーソルを遅くする ---- */
const Gauge = {
  create(targetM) {
    const c = DATA.gaugeSettings, z = c.zoneHalf, Z = c.zoneM;
    const pt = U.lerp(0.14, 0.86, U.clamp(targetM / c.maxM, 0, 1));
    return {
      p: 0, dir: 1, target: targetM, pt, z, Z,
      toMeters(p) {
        if (p < pt - z) return p / (pt - z) * (targetM - Z);
        if (p <= pt + z) return targetM + (p - pt) / z * Z;
        return targetM + Z + (p - pt - z) / (1 - pt - z) * (c.maxM - targetM - Z);
      },
      update(dt) {
        const near = Math.abs(this.p - pt) < z;
        this.p += this.dir * (1 / c.sweepSec) * (near ? c.zoneSlow : 1) * dt;
        if (this.p >= 1) { this.p = 1; if (c.bounce) this.dir = -1; else this.dir = 0; }   // 最大で止まる（戻らない）
        else if (this.p <= 0) { this.p = 0; this.dir = 1; }
      },
      get meters() { return this.toMeters(this.p); },
    };
  },
};

/* ==========================================================================
   6. INPUT  ―  どこを押しても反応する 1 ボタン操作
   ========================================================================== */
const MUTE_BTN = { x: 312, y: 10, w: 36, h: 36 };
const Input = {
  down: false,
  init(el) {
    const pos = (e) => { const r = el.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); Sound.unlock();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      const p = pos(e), b = MUTE_BTN;
      if (p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 6 && p.y <= b.y + b.h + 6) { Sound.setMuted(!Sound.muted); return; }
      this.press();
    });
    const up = (e) => { e.preventDefault(); this.release(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', () => this.release());
    window.addEventListener('blur', () => this.release());
    window.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); Sound.unlock(); this.press(); } });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); this.release(); } });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  press() { if (this.down) return; this.down = true; if (Scenes.cur && Scenes.cur.onDown) Scenes.cur.onDown(); },
  release() { if (!this.down) return; this.down = false; if (Scenes.cur && Scenes.cur.onUp) Scenes.cur.onUp(); },
};

/* ==========================================================================
   7. HUD  ―  共通 UI パーツ（2D 重ね描き）
   ========================================================================== */
const Hud = {
  topBar(g, showRound = true) {
    if (showRound) {
      Gfx.text(g, `ROUND ${State.round + 1}/${DATA.rounds}`, 16, 32, { size: 13, color: '#e6f0ff', stroke: 'rgba(0,0,0,0.5)', strokeW: 4 });
      Gfx.text(g, 'SCORE', 298, 22, { size: 9, align: 'right', color: '#cfe0ff', stroke: 'rgba(0,0,0,0.5)', strokeW: 3 });
      Gfx.text(g, U.fmt(State.score), 298, 40, Object.assign({}, DISP, { size: 17, align: 'right', stroke: 'rgba(0,0,0,0.5)', strokeW: 4 }));
    }
    this.mute(g);
  },
  mute(g) {
    const b = MUTE_BTN; g.save();
    Gfx.rr(g, b.x, b.y, b.w, b.h, 10); g.fillStyle = 'rgba(8,16,38,0.55)'; g.fill();
    g.fillStyle = '#dbe8ff'; g.strokeStyle = '#dbe8ff'; g.lineWidth = 2; g.lineCap = 'round';
    const cx = b.x + b.w / 2 - 3, cy = b.y + b.h / 2;
    g.beginPath(); g.moveTo(cx - 8, cy - 3); g.lineTo(cx - 3, cy - 3); g.lineTo(cx + 3, cy - 8); g.lineTo(cx + 3, cy + 8); g.lineTo(cx - 3, cy + 3); g.lineTo(cx - 8, cy + 3); g.closePath(); g.fill();

/* ==========================================================================
   8. 3D 基盤  ―  トゥーン素材 / アウトライン / ラベル / 車両 / 駅 / 空
   座標系: x = 線路方向（小倉 = 0、企救丘 = 8800）、y = 高さ、z = 横（+z がカメラ側）
   ========================================================================== */
const GRAD = (() => {
  const d = new Uint8Array([120, 185, 232]), t = new T.DataTexture(d, 3, 1, T.LuminanceFormat);
  t.minFilter = T.NearestFilter; t.magFilter = T.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
})();
const mat = (c, o) => new T.MeshToonMaterial(Object.assign({ color: c, gradientMap: GRAD }, o || {}));
const basic = (c, o) => new T.MeshBasicMaterial(Object.assign({ color: c }, o || {}));
const OUTLINE = new T.MeshBasicMaterial({ color: 0x0f1830, side: T.BackSide });

function outline(mesh, t = 0.16) {
  mesh.geometry.computeBoundingBox();
  const b = mesh.geometry.boundingBox, sx = Math.max(b.max.x - b.min.x, 0.01), sy = Math.max(b.max.y - b.min.y, 0.01), sz = Math.max(b.max.z - b.min.z, 0.01);
  const o = new T.Mesh(mesh.geometry, OUTLINE); o.scale.set(1 + 2 * t / sx, 1 + 2 * t / sy, 1 + 2 * t / sz); mesh.add(o); return mesh;
}
function box(parent, w, h, d, m, x = 0, y = 0, z = 0, ol = 0) {
  const me = new T.Mesh(new T.BoxGeometry(w, h, d), m); me.position.set(x, y, z); if (ol) outline(me, ol); parent.add(me); return me;
}
function cyl(parent, rt, rb, h, seg, m, x = 0, y = 0, z = 0, open = false) {
  const me = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg, 1, open), m); me.position.set(x, y, z); parent.add(me); return me;
}

/* ---- Canvas テクスチャのラベル（フォント読込後に描き直す） ---- */
const Labels = {
  list: [],
  make(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const tex = new T.CanvasTexture(c); this.list.push({ c, tex, draw, w, h });
    draw(c.getContext('2d'), w, h); tex.needsUpdate = true; return tex;
  },
  refresh() { for (const l of this.list) { l.c.getContext('2d').clearRect(0, 0, l.w, l.h); l.draw(l.c.getContext('2d'), l.w, l.h); l.tex.needsUpdate = true; } },
};
function signTexture(name, sub, bg, fg, border) {
  return Labels.make(512, 160, (g, w, h) => {
    Gfx.rr(g, 6, 6, w - 12, h - 12, 26); g.fillStyle = bg; g.fill(); g.lineWidth = 8; g.strokeStyle = border; g.stroke();
    const hasSub = !!sub, fs = Gfx.fit(g, name, w - 60, hasSub ? 78 : 92, FONT_B, 900);
    Gfx.text(g, name, w / 2, hasSub ? 90 : 104, { size: fs, weight: 900, align: 'center', color: fg });
    if (hasSub) Gfx.text(g, sub, w / 2, 134, { size: Math.min(28, Gfx.fit(g, sub, w - 70, 28, FONT_B, 700)), align: 'center', color: fg, alpha: 0.85 });
  });
}
// 名所の上に浮かぶ看板（ビルボード）
function labelSprite(text, wM, color = '#ffd24a') {
  const tex = Labels.make(512, 128, (g, w, h) => {
    Gfx.rr(g, 4, 4, w - 8, h - 8, 30); g.fillStyle = 'rgba(10,20,50,0.9)'; g.fill(); g.lineWidth = 7; g.strokeStyle = color; g.stroke();
    Gfx.text(g, text, w / 2, 84, { size: Gfx.fit(g, text, w - 56, 62, FONT_B, 900), weight: 900, align: 'center', color: '#ffffff' });
  });
  const s = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false })); s.scale.set(wM, wM / 4, 1); return s;
}
// 窓テクスチャ。glass = 昼に見える窓ガラス、lit = 夜に光る窓（8×8 の窓が 1 タイル）
function windowTextures() {
  const mk = (draw) => { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d'); draw(g); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t; };
  const r = U.seeded(21);
  const lit = mk((g) => { g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (r() < 0.55) { g.fillStyle = r() < 0.7 ? '#ffd98a' : '#9fd8ff'; g.fillRect(x * 8 + 1, y * 8 + 1, 6, 5); } });
  const glass = mk((g) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#5f7fae'; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) g.fillRect(x * 8 + 1, y * 8 + 1, 6, 5); });
  return { lit, glass };
}
const WIN = windowTextures(), WIN_TEX = WIN.lit, WIN_MAP = WIN.glass;
function litMat(color, rx, ry) {
  const tx = WIN_TEX.clone(), mp = WIN_MAP.clone();
  for (const t of [tx, mp]) { t.repeat.set(rx, ry); t.needsUpdate = true; }
  const m = mat(color, { map: mp, emissive: 0xffffff, emissiveMap: tx, emissiveIntensity: 0 }); m.userData.isLit = true; return m;
}
// 窓の並んだ直方体。窓の大きさは面の長さに合わせて揃える（bay = 窓1枠の幅[m]、floor = 1階分の高さ[m]）
function facadeBox(parent, w, h, d, color, x, baseY, z, o) {
  o = o || {}; const bay = o.bay || 4, fl = o.floor || 4.5;
  const side = (len) => litMat(color, Math.max(1, len / bay / 8), Math.max(1, h / fl / 8)), mx = side(d), mz = side(w), roof = mat(o.roof || '#a9b2c4');
  return box(parent, w, h, d, [mx, mx, roof, roof, mz, mz], x, baseY + h / 2, z, o.ol === undefined ? 0.3 : o.ol);
}

/* ---- 車両（実車と同じ 4 両・全長 60.47 m。原点 = 編成中央、y=0 = 桁上面） ---- */
function buildTrain() {
  const C = DATA.train.colors, g = new T.Group(), cars = DATA.train.cars, gap = 0.5, carLen = (TRAIN_LEN - (cars - 1) * gap) / cars;
  const mBody = mat('#dfe6f3'), mStripe = mat(C.stripe), mAcc = mat(C.accent), mSkirt = mat('#46526b'), mRoof = mat('#c9d4e6'), mDoor = mat('#dfe8f5');
  const mWin = basic('#2e5da8'), mGlass = basic(C.glass), mLamp = basic('#fff3b0');
  for (let i = 0; i < cars; i++) {
    const car = new T.Group(); car.position.x = -TRAIN_LEN / 2 + carLen / 2 + i * (carLen + gap); g.add(car);
    box(car, carLen, 3.4, 3.1, mBody, 0, 1.9, 0, 0.14);
    box(car, carLen + 0.05, 0.55, 3.16, mStripe, 0, 0.75, 0);
    box(car, carLen + 0.05, 0.14, 3.17, mAcc, 0, 0.32, 0);
    box(car, carLen - 1, 1.9, 0.22, mSkirt, 0, -0.75, 1.42); box(car, carLen - 1, 1.9, 0.22, mSkirt, 0, -0.75, -1.42);
    box(car, carLen - 3, 0.35, 2.4, mRoof, 0, 3.75, 0); box(car, 2.6, 0.5, 1.4, mRoof, -carLen * 0.25, 4.05, 0); box(car, 2.6, 0.5, 1.4, mRoof, carLen * 0.25, 4.05, 0);
    for (const s of [1, -1]) for (let k = 0; k < 6; k++) {
      const x = -carLen / 2 + (k + 0.5) * (carLen / 6), door = (k === 1 || k === 4);
      if (door) box(car, 1.5, 2.5, 0.06, mDoor, x, 1.75, s * 1.56); else box(car, 1.7, 1.15, 0.06, mWin, x, 2.55, s * 1.56);
    }
    for (const end of [1, -1]) {
      if (!((end === 1 && i === cars - 1) || (end === -1 && i === 0))) continue;
      const nose = new T.Mesh(new T.SphereGeometry(1, 20, 14), mBody); nose.scale.set(2.1, 1.95, 1.58); nose.position.set(end * (carLen / 2 - 0.2), 1.9, 0); car.add(nose);
      box(car, 0.25, 1.2, 2.2, mGlass, end * (carLen / 2 + 1.2), 2.55, 0);
      for (const z of [-0.9, 0.9]) { const l = new T.Mesh(new T.SphereGeometry(0.3, 10, 8), mLamp); l.position.set(end * (carLen / 2 + 1.15), 1.0, z); car.add(l); }
    }
  }
  const arrow = new T.Mesh(new T.ConeGeometry(1.3, 2.8, 4), basic('#ffd24a')); arrow.rotation.x = Math.PI; arrow.position.y = 8; g.add(arrow);
  const glow = new T.PointLight(0xfff0c0, 0, 90); glow.position.set(TRAIN_LEN / 2 + 3, 3, 0); g.add(glow);
  return { group: g, arrow, glow };
}

/* ---- 駅（高床ホーム + 屋根 + 駅名標 + 停止位置マーク） ---- */
function buildStation(st) {
  const g = new T.Group(); g.position.set(st.m, 0, 0);
  const mDeck = mat('#aab6cc'), mRoof = mat(st.color), mPost = mat('#5a6a88'), mBase = mat('#c9d3e6');
  box(g, 78, 0.9, 5.4, mDeck, 0, TRACK_Y - 0.2, -4.7, 0.1);
  box(g, 38, 8.6, 9, mBase, 0, 4.3, -5.6, 0.12);
  box(g, 38.4, 1.1, 9.4, mat(st.color), 0, 9.1, -5.6);
  for (const x of [-34, -17, 0, 17, 34]) cyl(g, 0.35, 0.35, TRACK_Y - 0.5, 8, mPost, x, (TRACK_Y - 0.5) / 2 + 0.2, -6.9);
  box(g, 80, 0.7, 10, mRoof, 0, TRACK_Y + 7.4, -4.9, 0.12);
  for (const x of [-38, -19, 0, 19, 38]) cyl(g, 0.3, 0.3, 7, 8, mPost, x, TRACK_Y + 3.9, -7.3);
  const tex = signTexture(st.name, st.kana, '#10234a', '#ffffff', '#ffd24a');
  const sign = new T.Mesh(new T.PlaneGeometry(26, 8.1), new T.MeshBasicMaterial({ map: tex, transparent: true, side: T.DoubleSide })); sign.position.set(0, TRACK_Y + 13, -4.9); g.add(sign);
  box(g, 0.5, 5.6, 0.5, mPost, -9, TRACK_Y + 10.2, -4.9); box(g, 0.5, 5.6, 0.5, mPost, 9, TRACK_Y + 10.2, -4.9);
  // 停止位置の目安（桁の上に塗装）: 中央 + ±1/5/10 m
  const mark = new T.Group(); mark.position.set(0, TRACK_Y + 0.28, -2.6); g.add(mark);
  box(mark, 0.6, 0.06, 2.2, basic('#ffd24a'), 0, 0, 0);
  for (const j of DATA.judge) for (const s of [-1, 1]) box(mark, 0.25, 0.06, 1.4, basic(j.color), s * j.tol, 0, 0);
  const beacon = new T.Mesh(new T.CylinderGeometry(2.6, 2.6, 70, 18, 1, true), new T.MeshBasicMaterial({ color: 0xffd24a, transparent: true, opacity: 0.28, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }));
  beacon.position.set(0, TRACK_Y + 35, -2.6); beacon.visible = false; g.add(beacon);
  return { group: g, beacon, st };
}

/* ---- 空・星・太陽 ---- */
function buildSky() {
  const geo = new T.SphereGeometry(3000, 24, 14), n = geo.attributes.position.count;
  geo.setAttribute('color', new T.BufferAttribute(new Float32Array(n * 3), 3));
  const dome = new T.Mesh(geo, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
  const sp = new Float32Array(240 * 3), r = U.seeded(33);
  for (let i = 0; i < 240; i++) { const a = r() * Math.PI * 2, e = 0.12 + r() * 1.2, R = 2800; sp[i * 3] = Math.cos(a) * Math.cos(e) * R; sp[i * 3 + 1] = Math.sin(e) * R; sp[i * 3 + 2] = Math.sin(a) * Math.cos(e) * R; }
  const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.BufferAttribute(sp, 3));
  const stars = new T.Points(sg, new T.PointsMaterial({ color: 0xffffff, size: 2.4, sizeAttenuation: false, fog: false, depthWrite: false }));
  const orb = new T.Mesh(new T.SphereGeometry(1, 16, 12), new T.MeshBasicMaterial({ color: 0xffffff, fog: false, depthWrite: false }));
  return {
    dome, stars, orb,
    paint(top, bottom) {
      const pos = geo.attributes.position, col = geo.attributes.color, a = new T.Color(top), b = new T.Color(bottom), c = new T.Color();
      for (let i = 0; i < n; i++) { const t = Math.pow(U.clamp((pos.getY(i) / 3000 + 0.12) / 1.0, 0, 1), 0.7); c.copy(b).lerp(a, t); col.setXYZ(i, c.r, c.g, c.b); }
      col.needsUpdate = true;
    },
  };
}

const POP = ['#ff8fb0', '#ffd24a', '#7fd8ff', '#9be04a', '#ff9a5a', '#b79cff', '#4fe0c0'];

function instanced(parent, geo, material, count) {
  const im = new T.InstancedMesh(geo, material, count); parent.add(im); im.frustumCulled = false; return im;
}
function setInst(im, i, x, y, z, sx, sy, sz, ry, color) {
  dummy.position.set(x, y, z); dummy.scale.set(sx, sy, sz); dummy.rotation.set(0, ry || 0, 0); dummy.updateMatrix();
  im.setMatrixAt(i, dummy.matrix); if (color) im.setColorAt(i, color.isColor ? color : new T.Color(color));
}
function finishInst(im) { im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true; }
function ellipseShape(a, b, holeA, holeB) {
  const s = new T.Shape(); s.absellipse(0, 0, a, b, 0, Math.PI * 2, false, 0);
  if (holeA) { const h = new T.Path(); h.absellipse(0, 0, holeA, holeB, 0, Math.PI * 2, true, 0); s.holes.push(h); }
  return s;
}
function flat(parent, shape, color, y) {
  const me = new T.Mesh(new T.ShapeGeometry(shape, 40), mat(color, { side: T.DoubleSide })); me.rotation.x = -Math.PI / 2; me.position.y = y; parent.add(me); return me;
}

    lv.forEach(([w, h, m, y]) => { box(g, w, h, w, m, 0, y, 0, 0.15); const c = new T.Mesh(new T.ConeGeometry(w * 0.82, 4.5, 4), roof); c.rotation.y = Math.PI / 4; c.position.y = y + h / 2 + 2.2; g.add(c); });
    box(g, 6, 5, 6, mat('#ffd24a'), 0, 49, 0, 0.12);

/* ==========================================================================
   10. WORLD  ―  3D シーンの組み立て（路線全長 8.8 km を実寸で配置）
   ========================================================================== */
const World = {
  scene: null, camera: null, sky: null, train: null, stations: [], landmarks: [], updaters: [], lit: [],
  mats: {}, building: null, vec: null,

  init() {
    const sc = this.scene = new T.Scene();
    const LT = DATA.lighting || { hemiScale: 0.5, sunScale: 0.6, fogNear: 260, fogFar: 2600 };
    sc.fog = new T.Fog(0xffffff, LT.fogNear, LT.fogFar);
    this.camera = new T.PerspectiveCamera(55, W / H, 1, 6000);
    this.hemi = new T.HemisphereLight(0xffffff, 0x8899aa, 1); sc.add(this.hemi);
    this.sun = new T.DirectionalLight(0xffffff, 1); sc.add(this.sun); sc.add(this.sun.target);
    this.sky = buildSky(); sc.add(this.sky.dome); sc.add(this.sky.stars); sc.add(this.sky.orb);
    this.vec = new T.Vector3();
    this.buildGround(); this.buildTrack(); this.buildStations(); this.buildLandmarks(); this.buildCity(); this.buildHills();
    this.train = buildTrain(); sc.add(this.train.group);
    this.applyPalette(0);
  },

  buildGround() {
    const len = END_X + 1400, cx = (END_X + 200) / 2, M = this.mats;
    M.ground = mat('#8fcf86'); M.road = mat('#59627a'); M.hill = mat('#7aa9c4');
    const gr = new T.Mesh(new T.PlaneGeometry(len, 2400), M.ground); gr.rotation.x = -Math.PI / 2; gr.position.set(cx, 0, 0); this.scene.add(gr);
    const rd = new T.Mesh(new T.PlaneGeometry(len - 400, 18), M.road); rd.rotation.x = -Math.PI / 2; rd.position.set(cx, 0.08, 0); this.scene.add(rd);
    const n = Math.floor((len - 400) / 14), dash = instanced(this.scene, new T.BoxGeometry(5, 0.05, 0.35), basic('#ffffff'), n);
    for (let i = 0; i < n; i++) setInst(dash, i, cx - (len - 400) / 2 + i * 14, 0.14, 0, 1, 1, 1); finishInst(dash);
  },

  buildTrack() {
    const sc = this.scene, len = END_X + 44, mBeam = mat('#a3afc4');
    const beam = new T.Mesh(new T.BoxGeometry(len, 2.0, 2.2), mBeam); beam.position.set((END_X - 44) / 2, TRACK_Y - 1.0, 0); sc.add(beam);
    const top = new T.Mesh(new T.BoxGeometry(len, 0.12, 2.3), mat('#7a869b')); top.position.set((END_X - 44) / 2, TRACK_Y + 0.05, 0); sc.add(top);
    const xs = []; for (let x = -84 + 28; x < END_X; x += 28) if (x > 56) xs.push(x);
    const pil = instanced(sc, new T.CylinderGeometry(1.1, 1.3, TRACK_Y - 2, 8), mat('#a9b4c6'), xs.length), head = instanced(sc, new T.BoxGeometry(5.4, 1.2, 2.8), mat('#a9b4c6'), xs.length);
    xs.forEach((x, i) => { setInst(pil, i, x, (TRACK_Y - 2) / 2, 0, 1, 1, 1); setInst(head, i, x, TRACK_Y - 2.4, 0, 1, 1, 1); }); finishInst(pil); finishInst(head);
    const stop = new T.Group(); stop.position.set(END_X, 0, 0); sc.add(stop);
    box(stop, 2, 5, 4.5, mat('#ffcf3a'), 0, TRACK_Y + 1.5, 0, 0.15); for (let i = 0; i < 3; i++) box(stop, 2.1, 0.9, 4.6, mat('#222222'), 0, TRACK_Y + 0.2 + i * 1.5, 0);
  },

  buildStations() {
    for (const st of STATIONS) { if (st.m === 0) continue; const s = buildStation(st); this.scene.add(s.group); this.stations.push(s); }
    // 小倉駅（始発）のホームは駅ビル内に置く
    const k = buildStation(STATIONS[0]); k.group.visible = false; this.scene.add(k.group); this.stations.unshift(k);
  },

  buildLandmarks() {
    const filter = DATA.landmarkFilter || ['window'];
    for (const def of DATA.landmarks) {
      if (!def.enabled || filter.indexOf(def.evidence) < 0 || !Landmarks[def.kind]) continue;
      const b = Landmarks[def.kind](def), km = def.km !== undefined ? def.km : (def.kmFrom + def.kmTo) / 2;
      b.group.position.set(km * 1000, 0, def.z || 0); this.scene.add(b.group);
      b.def = def; this.landmarks.push(b);
      if (b.update) this.updaters.push(b.update);
      if (def.kind === 'stationBuilding') this.building = b;
    }
    // 窓の灯り（夜に光る素材）を集める
    this.scene.traverse((o) => { const ms = Array.isArray(o.material) ? o.material : [o.material]; for (const m of ms) if (m && m.userData && m.userData.isLit && this.lit.indexOf(m) < 0) this.lit.push(m); });
  },

  buildCity() {
    const N = 1500, r = U.seeded(101), M = this.mats, sc = this.scene;
    M.city = mat('#ffffff', { emissive: 0xffffff, emissiveMap: WIN_TEX, emissiveIntensity: 0 });
    const pastel = ['#e58fa8', '#7fb6e8', '#f0c860', '#8fcf9a', '#f0a078', '#a99be0', '#cfd7e6', '#8f9db8'];
    const city = instanced(sc, new T.BoxGeometry(1, 1, 1), M.city, N); let n = 0;
    const blocked = (x, z) => {
      if (x > -140 && x < 110 && Math.abs(z) < 150) return true;
      for (const l of this.landmarks) { const r0 = l.footprint || 0; if (!r0) continue; const dx = x - l.group.position.x, dz = z - l.group.position.z; if (dx * dx + dz * dz < (r0 + 24) * (r0 + 24)) return true; }
      return false;
    };
    for (let tries = 0; tries < N * 2 && n < N; tries++) {
      const x = -300 + r() * (END_X + 700), side = r() < 0.5 ? -1 : 1, z = side * (36 + Math.pow(r(), 1.5) * 420);
      if (blocked(x, z)) continue;
      const w = 12 + r() * 24, d = 12 + r() * 24, h = 8 + Math.pow(r(), 2) * 56;
      const tint = new T.Color(pastel[Math.floor(r() * pastel.length)]); tint.multiplyScalar(0.8 + r() * 0.35);
      setInst(city, n++, x, h / 2, z, w, h, d, r() < 0.3 ? Math.PI / 2 : 0, tint);
    }
    city.count = n; finishInst(city);
  },

  buildHills() {
    const r = U.seeded(202), N = 70, hills = instanced(this.scene, new T.SphereGeometry(1, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), this.mats.hill, N);
    for (let i = 0; i < N; i++) setInst(hills, i, -500 + r() * (END_X + 1400), -2, (i % 2 ? 1 : -1) * (700 + r() * 500), 200 + r() * 260, 90 + r() * 200, 200 + r() * 260, 0, '#ffffff');
    finishInst(hills);
  },

  /* 時間帯（朝→夜）を適用。数値は game-data.js の skies */
  applyPalette(idx) {
    const p = DATA.skies[idx % DATA.skies.length], M = this.mats, d = p.sunDir;
    this.sky.paint(p.skyTop, p.skyBottom);
    this.scene.fog.color.set(p.fog);
    this.hemi.color.set(p.hemiSky); this.hemi.groundColor.set(p.hemiGround); const LT = DATA.lighting || { hemiScale: 0.5, sunScale: 0.6 }; this.hemi.intensity = p.hemi * LT.hemiScale;
    this.sun.color.set(p.sun); this.sun.intensity = p.sunI * LT.sunScale; this.sun.position.set(d[0] * 200, d[1] * 200, d[2] * 200);
    M.ground.color.set(p.ground); M.road.color.set(p.road); M.hill.color.set(p.far);
    this.sky.stars.visible = !!p.stars;
    this.sky.orb.material.color.set(p.orb.color); this.sky.orb.scale.setScalar(p.orb.size * 4); this.orbDir = p.orb.dir;
    M.city.emissiveIntensity = p.glow * 0.8; for (const l of this.lit) l.emissiveIntensity = p.glow * 0.9;
    const TL = this.trainLight(); this.train.glow.distance = TL.range; this.train.glow.intensity = p.glow * TL.night; this.glow = p.glow;
  },

  trainLight() { return (DATA.lighting && DATA.lighting.trainLight) || { night: 0.7, launch: 0.5, charge: 0.9, range: 55 }; },
  setTarget(st) { for (const s of this.stations) s.beacon.visible = !!st && s.st === st; },
  // 発車カットシーン用: 南面のガラスを外し、開口から車両が見えるようにする
  setLaunchMode(on) { const b = this.building; if (b) b.southGlass.visible = !on; },
  setChargeMode(on) { if (this.building) this.building.exitGlow.visible = on; },
  chargeFx(p) {
    if (!this.building) return;
    const c = this.building.ribMat.color; c.setRGB(U.lerp(0.35, 1.0, p), U.lerp(0.82, 0.68, p), U.lerp(1.0, 0.25, p));
    const TL = this.trainLight(); this.train.glow.intensity = Math.max(this.glow * TL.night, p * TL.charge);
  },

  update(t, dt) {
    const cam = this.camera.position;
    this.sky.dome.position.copy(cam); this.sky.stars.position.copy(cam);
    const o = this.orbDir; this.sky.orb.position.set(cam.x + o[0] * 2600, cam.y + o[1] * 2600, cam.z + o[2] * 2600);
    for (const f of this.updaters) f(t);
    this.train.arrow.position.y = 8 + Math.sin(t * 5) * 0.6; this.train.arrow.rotation.y = t * 2;
    for (const s of this.stations) if (s.beacon.visible) s.beacon.material.opacity = 0.2 + 0.12 * Math.sin(t * 4);
  },

  // 3D 位置 → HUD の論理座標（背面なら null）
  project(x, y, z) {
    const v = this.vec.set(x, y, z).project(this.camera);
    if (v.z > 1) return null;
    return { x: (v.x * 0.5 + 0.5) * W, y: (-v.y * 0.5 + 0.5) * H };
  },
};

/* ==========================================================================
   11. SCENES  ―  各シーンは update(dt)（3D とカメラを動かす）と draw(g)（HUD）を持つ
   ========================================================================== */
const Scenes = {
  cur: null, map: {},
  go(name, arg) { if (this.cur && this.cur.exit) this.cur.exit(); this.cur = this.map[name]; this.cur.enter(arg); },
};

function setCam(px, py, pz, lx, ly, lz, fov) {
  const c = World.camera; c.position.set(px, py, pz); c.lookAt(lx, ly, lz);
  if (Math.abs(c.fov - fov) > 0.01) { c.fov = fov; c.updateProjectionMatrix(); }
}
function placeTrain(x, o = {}) {
  const g = World.train.group;
  g.position.set(x + (o.jx || 0), TRACK_Y + (o.dy || 0), o.jz || 0); g.rotation.set(o.rx || 0, 0, o.rz || 0);
  World.train.arrow.visible = !!o.arrow;
}
const rnd = () => Math.random() * 2 - 1;

/* ---- Charge（駅ビル内。後方視点でパワーをためる） ---- */
Scenes.map.charge = {
  enter() {
    this.t = 0; this.phase = 'ready'; this.target = State.target; this.gauge = Gauge.create(this.target.m); FX.clear();
    World.applyPalette(State.round); World.setTarget(this.target); World.setChargeMode(true);
    if (!this.streaks) {
      const n = 90, pos = new Float32Array(n * 6); this.seg = Array.from({ length: n }, () => ({ x: U.rand(-100, 44), y: TRACK_Y + U.rand(-4, 8), z: U.rand(-11, 11), s: U.rand(0.6, 1.4) }));
      const geo = new T.BufferGeometry(); geo.setAttribute('position', new T.BufferAttribute(pos, 3));
      this.streaks = new T.LineSegments(geo, new T.LineBasicMaterial({ color: 0xffc060, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false })); this.streaks.frustumCulled = false;
      World.scene.add(this.streaks);
    }
    this.streaks.visible = true;
  },
  exit() { Sound.chargeStop(); World.setChargeMode(false); World.chargeFx(0); if (this.streaks) this.streaks.visible = false; },
  update(dt) {
    this.t += dt;
    const charging = this.phase === 'charging';
    if (charging) { this.gauge.update(dt); Sound.chargeSet(this.gauge.p); }
    const p = charging ? this.gauge.p : 0, c = DATA.camera.charge, sh = charging ? 0.06 + 0.5 * p : 0.03;
    World.chargeFx(p); World.train.arrow.visible = false;
    placeTrain(0, { dy: rnd() * sh * 0.4, jz: rnd() * sh * 0.4, rz: rnd() * sh * 0.01 });
    setCam(c.pos[0] + rnd() * sh, TRACK_Y + c.pos[1] + rnd() * sh, c.pos[2] + rnd() * sh, c.look[0], TRACK_Y + c.look[1], c.look[2], c.fov + 14 * p);
    // 光の筋がトンネルの奥から迫ってくる
    const pos = this.streaks.geometry.attributes.position, sp = 30 + 260 * p, len = 2 + 16 * p;
    this.seg.forEach((s, i) => { s.x -= sp * s.s * dt; if (s.x < -105) s.x = 44; pos.setXYZ(i * 2, s.x, s.y, s.z); pos.setXYZ(i * 2 + 1, s.x + len * s.s, s.y, s.z); });
    pos.needsUpdate = true; this.streaks.material.opacity = charging ? 0.15 + 0.7 * p : 0.12;
    FX.update(dt);
  },
  onDown() { if (this.phase === 'ready' && this.t > 0.3) { this.phase = 'charging'; Sound.chargeStart(); } },
  onUp() {
    if (this.phase !== 'charging') return;
    this.phase = 'released'; Sound.chargeStop();
    Scenes.go('launch', { target: this.target, D: this.gauge.meters, p: this.gauge.p });
  },
  draw(g) {
    const p = this.phase === 'charging' ? this.gauge.p : 0, t = this.t;
    if (this.phase === 'charging') Hud.speedLines(g, t, p * 0.7);
    Hud.topBar(g); Hud.targetCard(g, this.target, U.smooth(0, 0.45, t)); Hud.gauge(g, this.gauge, 190);
    if (this.phase === 'charging') Hud.loupe(g, this.gauge, 236);
    Hud.prompt(g, this.phase === 'ready' ? DATA.text.ready : (this.gauge.p >= 1 ? (DATA.text.chargeMax || DATA.text.charging) : DATA.text.charging), 604, t);
  },
};

/* ---- Launch（小倉駅ビルから飛び出す 3 カメのカット。構成は game-data.js の launch.shots） ---- */
Scenes.map.launch = {
  enter(a) {
    this.a = a; this.t = 0; this.burst = false; this.done = false; this.cam = null; this.shot = -1; this.x = 0; FX.clear();
    this.L = Math.min(DATA.launch.travelMaxM || 180, a.D * 0.4);       // このカットで走る距離（走行シーンの開始位置になる）
    World.applyPalette(State.round); World.setChargeMode(false); World.setLaunchMode(true); World.setTarget(State.target);
  },
  exit() { World.setLaunchMode(false); },
  // 今のカット番号と、そのカット内の進行(0-1)
  shotAt(t) {
    const S = DATA.launch.shots; let i = S.findIndex((s) => t < s.until); if (i < 0) i = S.length - 1;
    const t0 = i ? S[i - 1].until : 0; return { i, s: S[i], k: U.clamp((t - t0) / Math.max(0.05, S[i].until - t0), 0, 1) };
  },
  update(dt) {
    this.t += dt; const Ld = DATA.launch, A = Ld.anticipate, t = this.t, bt = Math.max(0.3, Ld.sec - A), TL = World.trainLight();
    if (!this.burst && t >= A) { this.burst = true; Sound.launch(); Flash.hit('#ffffff', 0.85, 5); }
    const u = U.clamp((t - A) / bt, 0, 1), x = t < A ? 0 : this.L * Math.pow(u, Ld.accelPower || 1.7);
    this.x = x;
    const pre = t < A ? t / A : 0;
    placeTrain(x, { jz: rnd() * 0.1 * pre, dy: rnd() * 0.1 * pre });
    World.train.glow.intensity = TL.launch;

    const { i, s, k } = this.shotAt(t), e = U.smooth(0, 1, k), d = s.dolly || [0, 0, 0];
    if (i !== this.shot) { if (this.shot >= 0) Flash.hit('#ffffff', 0.35, 9); this.shot = i; }     // カットが変わる瞬間に短く光る
    let p, l;
    if (s.mode === 'follow') { p = [x + s.pos[0] + d[0] * k, TRACK_Y + s.pos[1] + d[1] * k, s.pos[2] + d[2] * k]; l = [x + s.look[0], TRACK_Y + s.look[1], s.look[2]]; }
    else {
      p = [s.pos[0] + d[0] * k, TRACK_Y + s.pos[1] + d[1] * k, s.pos[2] + d[2] * k];
      const tr = (s.track || 0) * e, tx = x + (s.lead || 20);
      l = [U.lerp(s.look[0], tx, tr), TRACK_Y + s.look[1], s.look[2]];
    }
    const sh = s.shake || 0, fov = U.lerp(s.fov, s.fovTo === undefined ? s.fov : s.fovTo, e);
    p = [Math.max(p[0], Ld.minCamX || 55) + rnd() * sh, p[1] + rnd() * sh * 0.5, p[2] + rnd() * sh];   // 駅ビルの中には入らない
    setCam(p[0], p[1], p[2], l[0], l[1], l[2], fov); this.cam = { p, l, f: fov };
    FX.update(dt);
    if (t >= Ld.sec) this.finish();
  },
  onDown() { if (this.t > DATA.launch.skipAfter) this.finish(); },
  finish() { if (this.done) return; this.done = true; Flash.hit('#ffffff', 0.5, 6); Scenes.go('run', Object.assign({}, this.a, { x0: this.x, cam: this.cam })); },
  draw(g) {
    const t = this.t, A = DATA.launch.anticipate, age = t - A, bu = U.clamp(age / Math.max(0.3, DATA.launch.sec - A), 0, 1);
    if (t >= A) Hud.speedLines(g, t, U.clamp(bu * 1.4, 0, 1) * (0.45 + 0.55 * this.a.p));
    if (t >= A + 0.04) {
      const s = 1 + 1.3 * Math.exp(-9 * age), al = U.clamp(1 - (age - 1.0) * 3, 0, 1);
      g.save(); g.translate(188, 196); g.rotate(-0.13); g.scale(s, s); g.globalAlpha = al;
      const o = Object.assign({}, DISP, { size: 66, align: 'center', color: '#ffe14a' });
      Gfx.text(g, 'ズバッ！', 0, 0, Object.assign({}, o, { stroke: '#ffffff', strokeW: 22 }));
      Gfx.text(g, 'ズバッ！', 0, 0, Object.assign({}, o, { stroke: '#d1103a', strokeW: 12 }));
      Gfx.text(g, 'ズバッ！', 0, 0, o); g.restore();
    }
    const bar = 46 * U.smooth(0, 0.3, t); g.fillStyle = '#000'; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar);
    if (t > DATA.launch.skipAfter) Gfx.text(g, 'TAP でスキップ', 180, H - bar + 28, { size: 10, align: 'center', color: 'rgba(255,255,255,0.55)' });
    FX.draw(g);
  },
};

/* ---- Run + Result（走行 → 停車 → 判定） ---- */
Scenes.map.run = {
  enter(a) {
    this.target = a.target; this.D = a.D; this.t = 0; this.phase = 'run'; this.u = 0; this.x0 = Math.min(a.x0 || 0, a.D); this.x = this.x0; this.blendCam = a.cam || null; this.blend = a.cam ? 1 : 0; this.v = 0; this.k = 0; this.derail = null; this.shake = 0;
    this.brakeDone = false; this.rt = 0; this.fwTimer = 0; this.scoreShown = 0; this.res = null; this.sparkT = 0;
    this.derailed = this.D + TRAIN_LEN / 2 > END_X;
    this.err = this.D - this.target.m;
    this.judge = Judgement.evaluate(this.err, this.derailed);
    this.anchor = this.judge.ok ? this.target.m : this.D;           // 停車カメラの注視点
    this.T = DATA.run.baseSec + DATA.run.secPerSqrtKm * Math.sqrt(this.D / 1000);
    this.zoomF = this.judge.id === 'PERFECT' ? DATA.run.zoomPerfect : this.judge.id === 'GREAT' ? DATA.run.zoomGreat : 1;
    FX.clear(); World.applyPalette(State.round); World.setTarget(this.target); World.setChargeMode(false);
    this.camPos = null;
  },
  startDerail() {
    const d = this.derail = { t: 0, vx: Math.max(60, this.v), y: 0, vy: 0, rot: 0 };
    this.x = END_X - TRAIN_LEN / 2; this.shake = 1.2; Sound.crash(); Flash.hit('#ffd9a0', 0.5, 5);
    const p = World.project(this.x + TRAIN_LEN / 2, TRACK_Y + 1, 0); if (p) { FX.sparks(p.x, p.y, 36, 1, '#ffcf6a'); FX.smoke(p.x, p.y, 8); }
    return d;
  },
  finish() {
    this.phase = 'result'; this.rt = 0;
    const j = this.judge; this.res = State.record(j, this.err); Sound.result(j.id);
    const p = World.project(this.x, TRACK_Y + 3, 0) || { x: 180, y: 330 };
    if (j.id === 'PERFECT') { Flash.hit('#fff3c0', 0.6, 4); this.fwTimer = 0; }
    else if (j.id === 'GREAT') FX.confetti(70, -10);
    else if (j.id === 'GOOD') { for (let i = 0; i < 8; i++) FX.add({ kind: 'spark', x: p.x, y: p.y, vx: U.rand(-60, 60), vy: U.rand(-140, -40), g: 200, life: 0.7, size: 2, color: '#8fdcff' }); }
    else { this.shake = Math.max(this.shake, 0.9); FX.smoke(p.x, p.y, 12); }
  },
  update(dt) {
    this.t += dt; this.shake = Math.max(0, this.shake - dt * 2.4);
    const half = TRAIN_LEN / 2, P = DATA.run.decelPower;
    if (this.phase === 'run') {
      this.u = U.clamp(this.t / this.T, 0, 1);
      if (!this.derail) {
        this.x = this.x0 + (this.D - this.x0) * (1 - Math.pow(1 - this.u, P)); this.v = (this.D - this.x0) * P * Math.pow(1 - this.u, P - 1) / this.T;
        if (this.derailed && this.x + half > END_X) this.startDerail();
        else {
          const rem = this.D - this.x;
          if (!this.brakeDone && rem < 500) { this.brakeDone = true; Sound.brake(Math.max(0.5, this.T * (1 - this.u)), !this.judge.ok); }
          if (rem < 500 && this.u < 0.99) { this.sparkT -= dt; if (this.sparkT <= 0) { this.sparkT = 0.05; const p = World.project(this.x - 20, TRACK_Y - 1.5, 1.5); if (p) FX.sparks(p.x, p.y, 2, -1, '#ffd98a'); } }
          if (this.u >= 1) this.finish();
        }
      }
      if (this.derail) {
        const d = this.derail; d.t += dt; d.vx *= Math.pow(0.35, dt); this.x += d.vx * dt; this.v = d.vx;
        if (d.t > 0.25) { d.vy += 30 * dt; d.y -= d.vy * dt; d.rot = Math.min(0.5, d.rot + 0.5 * dt); }
        if (d.y < -(TRACK_Y - 1.5)) { d.y = -(TRACK_Y - 1.5); if (!d.hit) { d.hit = true; this.shake = 1.4; const p = World.project(this.x, 2, 0); if (p) FX.smoke(p.x, p.y, 14); } }
        const p = World.project(this.x + half, TRACK_Y + 1 + d.y, 0); if (p && Math.random() < 0.8) FX.sparks(p.x, p.y, 2, 1, '#ffcf6a');
        if (d.t > 1.4) this.finish();
      }
    } else {
      this.rt += dt;
      this.scoreShown = Math.min(this.res.pts, this.scoreShown + this.res.pts * dt * 1.6);
      if (this.judge.id === 'PERFECT' && this.rt < 2.6) {
        this.fwTimer -= dt;
        if (this.fwTimer <= 0) { this.fwTimer = 0.28; FX.firework(U.rand(60, 300), U.rand(90, 260), U.pick(['#ffd24a', '#ff7fa8', '#8fdcff', '#9dffb8', '#ffffff'])); Sound.noise(0.18, { type: 'highpass', f0: 3500, f1: 1500, gain: 0.07 }); }
      }
    }
    this.k = U.clamp(this.v / 1500, 0, 1) * (this.phase === 'run' ? 1 : 0);
    // 3D: 車両とカメラ
    const d = this.derail;
    placeTrain(this.x, { arrow: !d, dy: d ? d.y : 0, rz: d ? -d.rot : 0, rx: d ? d.rot * 0.6 : 0 });
    const c = DATA.camera.run, s = DATA.camera.station, wide = this.judge.ok ? 1 : 1.7;
    const rem = this.anchor - this.x, b = d ? 0 : U.smooth(0, 1, 1 - U.clamp((rem - 40) / 220, 0, 1));
    const cp = [this.x + c.pos[0], TRACK_Y + c.pos[1], c.pos[2]], cl = [this.x + c.look[0], TRACK_Y + c.look[1], c.look[2]];
    const sp = [this.anchor + s.pos[0], TRACK_Y + s.pos[1] + (wide - 1) * 6, s.pos[2] * wide], sl = [this.anchor + s.look[0], TRACK_Y + s.look[1], s.look[2]];
    const pos = [0, 1, 2].map((i) => U.lerp(cp[i], sp[i], b)), look = [0, 1, 2].map((i) => U.lerp(cl[i], sl[i], b));
    if (this.phase === 'result' && this.zoomF < 1) { const z = U.lerp(1, this.zoomF, U.smooth(0, 1.2, this.rt)); for (let i = 0; i < 3; i++) pos[i] = look[i] + (pos[i] - look[i]) * z; }
    let fov = U.lerp(c.fov + c.fovAtSpeed * this.k, s.fov, b);
    if (this.blend > 0 && this.blendCam) {            // 発車カットの最後のカメラから滑らかにつなぐ
      this.blend = Math.max(0, this.blend - dt / 0.8); const q = U.smooth(0, 1, this.blend), bc = this.blendCam;
      for (let i = 0; i < 3; i++) { pos[i] = U.lerp(pos[i], bc.p[i], q); look[i] = U.lerp(look[i], bc.l[i], q); } fov = U.lerp(fov, bc.f, q);
    }
    if (this.x < 190) pos[0] = Math.max(pos[0], (DATA.launch && DATA.launch.minCamX) || 55);   // 発車直後もカメラは駅ビルの外
    const sh = this.shake + this.k * 0.35;
    setCam(pos[0] + rnd() * sh, pos[1] + rnd() * sh, pos[2] + rnd() * sh, look[0], look[1], look[2], fov);
    FX.update(dt);
  },
  onDown() {
    if (this.phase !== 'result' || this.rt < 0.7) return;
    if (State.round + 1 < DATA.rounds) { State.round++; Scenes.go('charge'); } else { State.finish(); Scenes.go('final'); }
  },
  // 今通っている名所（実在の名所名）をバッジで表示
  sightBadge(g) {
    let best = null, bd = 1e9;
    for (const l of World.landmarks) { const df = l.def, km = df.km !== undefined ? df.km : (df.kmFrom + df.kmTo) / 2, d = Math.abs(km * 1000 - this.x); if (d < bd) { bd = d; best = df; } }
    if (!best || bd > 320) return;
    const a = U.clamp(1 - bd / 320, 0, 1), w = Math.min(320, 60 + best.name.length * 15);
    g.save(); g.globalAlpha = a; Gfx.rr(g, 180 - w / 2, 540, w, 34, 17); g.fillStyle = 'rgba(8,18,44,0.82)'; g.fill(); g.strokeStyle = '#9fe6ff'; g.lineWidth = 1.5; g.stroke();
    Gfx.text(g, '★ ' + best.name, 180, 562, { size: Gfx.fit(g, '★ ' + best.name, w - 24, 14, FONT_B, 900), weight: 900, align: 'center', color: '#e9f6ff' }); g.restore();
  },
  draw(g) {
    Hud.speedLines(g, this.t, this.k); FX.draw(g); Hud.topBar(g);
    if (this.phase === 'run') {
      Hud.route(g, 62, this.x, this.target);
      const rem = this.target.m - this.x;
      Gfx.text(g, rem >= 0 ? `あと ${U.dist(rem)}` : `通過 ${U.dist(-rem)}`, 180, 150, Object.assign({}, DISP, { size: 22, align: 'center', color: rem >= -1 ? '#fff' : '#ff8a96', stroke: 'rgba(0,0,0,0.6)', strokeW: 5 }));
      this.sightBadge(g);
    } else this.drawResult(g);
  },
  drawResult(g) {
    const j = this.judge, rt = this.rt, s = 1 + 0.9 * Math.exp(-7 * rt) * Math.cos(18 * rt), al = U.clamp(rt * 8, 0, 1);
    const fs = Gfx.fit(g, j.label, 320, 52, FONT_D, 400);
    g.save(); g.translate(180, 214); g.scale(s, s); g.globalAlpha = al;
    Gfx.text(g, j.label, 0, 0, Object.assign({}, DISP, { size: fs, align: 'center', color: j.color, stroke: j.edge, strokeW: 11 }));
    Gfx.text(g, j.label, 0, 0, Object.assign({}, DISP, { size: fs, align: 'center', color: j.color })); g.restore();
    Gfx.text(g, j.sub, 180, 252, { size: 16, weight: 900, align: 'center', color: '#fff', stroke: 'rgba(0,0,0,0.6)', strokeW: 5, alpha: U.clamp((rt - 0.15) * 6, 0, 1) });
    const k = U.smooth(0.3, 0.7, rt), y = 446 + (1 - k) * 200;
    g.save(); g.globalAlpha = k;
    Gfx.rr(g, 16, y, 328, 160, 16); g.fillStyle = 'rgba(6,14,36,0.9)'; g.fill(); g.strokeStyle = 'rgba(120,190,255,0.5)'; g.lineWidth = 1.5; g.stroke();
    Gfx.text(g, `${this.target.name} 駅  ${U.km1(this.target.m)}`, 32, y + 28, Object.assign({}, DISP, { size: Gfx.fit(g, `${this.target.name} 駅  ${U.km1(this.target.m)}`, 200, 17, FONT_D, 400) }));
    Gfx.text(g, '誤差', 32, y + 54, { size: 11, color: '#8ea8d8' });
    Gfx.text(g, `${U.sign(this.err)} m`, 32, y + 82, Object.assign({}, DISP, { size: 26, color: j.color }));
    Gfx.text(g, 'SCORE', 328, y + 54, { size: 11, align: 'right', color: '#8ea8d8' });
    Gfx.text(g, `+${U.fmt(this.scoreShown)}`, 328, y + 82, Object.assign({}, DISP, { size: 26, align: 'right', color: '#ffd24a' }));
    if (this.res.combo >= 2) Gfx.text(g, `COMBO ×${this.res.combo}`, 328, y + 28, { size: 14, weight: 900, align: 'right', color: '#6dffb8' });
    Gfx.text(g, `距離ボーナス ×${this.res.mult.toFixed(2)}`, 32, y + 102, { size: 10, color: '#8ea8d8' });
    if (this.target.spot) Gfx.text(g, '★ ' + this.target.spot, 32, y + 120, { size: Gfx.fit(g, '★ ' + this.target.spot, 296, 12, FONT_B, 700), color: '#9fe6ff' });
    const msg = State.round + 1 < DATA.rounds ? DATA.text.next : DATA.text.toFinal;
    Gfx.text(g, msg + ' ▶', 180, y + 148, { size: 14, align: 'center', color: '#ffe9a8', alpha: rt > 0.7 ? 0.6 + 0.4 * Math.sin(rt * 6) : 0 });
    g.restore();
  },
};

/* ---- Final ---- */
Scenes.map.final = {
  enter() { this.t = 0; this.rank = State.rankInfo(); FX.clear(); World.applyPalette(4); World.setTarget(null); World.setChargeMode(false); Sound.result(this.rank.id === 'C' ? 'GOOD' : 'PERFECT'); this.fw = 0; },
  update(dt) {
    this.t += dt; const w = this.t * 0.25;
    placeTrain(110, { dy: Math.sin(this.t * 7) * 0.03 });
    setCam(150 + 60 * Math.sin(w), TRACK_Y + 12, 52 + 12 * Math.cos(w * 1.3), 100, TRACK_Y + 4, 0, 52);
    FX.update(dt);
    if (this.rank.id === 'S' && this.t < 4) { this.fw -= dt; if (this.fw <= 0) { this.fw = 0.35; FX.firework(U.rand(50, 310), U.rand(80, 240), U.pick(['#ffd24a', '#ff7fa8', '#8fdcff', '#9dffb8'])); } }
  },
  onDown() { if (this.t > 0.8) { State.reset(); Scenes.go('charge'); } },
  draw(g) {
    const t = this.t;
    g.fillStyle = 'rgba(4,8,22,0.72)'; g.fillRect(0, 0, W, H);
    Gfx.text(g, 'RESULT', 180, 60, { size: 13, align: 'center', color: '#8ea8d8' });
    const k = U.smooth(0, 0.5, t), s = 1 + 0.8 * Math.exp(-6 * t) * Math.cos(14 * t);
    g.save(); g.translate(180, 168); g.scale(s, s); g.globalAlpha = k;
    const col = this.rank.id === 'S' ? '#ffd24a' : this.rank.id === 'A' ? '#6dffb8' : this.rank.id === 'B' ? '#8fdcff' : '#c8d0e4';
    Gfx.text(g, this.rank.id, 0, 0, Object.assign({}, DISP, { size: 120, align: 'center', color: col, stroke: 'rgba(0,0,0,0.5)', strokeW: 12 }));
    Gfx.text(g, this.rank.id, 0, 0, Object.assign({}, DISP, { size: 120, align: 'center', color: col })); g.restore();
    Gfx.text(g, U.fmt(State.score), 180, 224, Object.assign({}, DISP, { size: 34, align: 'center' }));
    if (State.newRecord) Gfx.text(g, 'NEW RECORD!', 180, 248, { size: 14, weight: 900, align: 'center', color: '#ffd24a', alpha: 0.6 + 0.4 * Math.sin(t * 8) });
    else Gfx.text(g, `BEST ${U.fmt(State.best)}`, 180, 248, { size: 12, align: 'center', color: '#8ea8d8' });
    State.results.forEach((r, i) => {
      const y = 280 + i * 48, a = U.clamp((t - 0.3 - i * 0.12) * 5, 0, 1);
      g.save(); g.globalAlpha = a; Gfx.rr(g, 20, y, 320, 40, 10); g.fillStyle = 'rgba(255,255,255,0.07)'; g.fill();
      Gfx.text(g, String(i + 1), 36, y + 26, { size: 13, weight: 900, align: 'center', color: '#8ea8d8' });
      Gfx.text(g, r.station, 54, y + 26, { size: Gfx.fit(g, r.station, 110, 16, FONT_B, 900), weight: 900 });
      Gfx.text(g, r.judge.label.replace('!', ''), 206, y + 26, { size: 13, weight: 900, align: 'center', color: r.judge.color });
      Gfx.text(g, `${U.sign(r.err)} m`, 262, y + 26, { size: 12, align: 'center', color: '#bcd2ff' });
      Gfx.text(g, U.fmt(r.pts), 330, y + 26, { size: 14, weight: 900, align: 'right', color: '#ffd24a' }); g.restore();
    });
    Hud.prompt(g, DATA.text.retry, 604, t); Hud.topBar(g, false); FX.draw(g);
  },
};

/* ==========================================================================
   12. MAIN  ―  レンダラ / リサイズ / ループ
   ========================================================================== */
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap'), glCanvas = document.getElementById('gl'), hud = document.getElementById('hud'), g2 = hud.getContext('2d');
let renderer = null;

function resize() {
  const r = wrap.getBoundingClientRect(), aw = r.width || W, ah = r.height || H, s = Math.min(aw / W, ah / H), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  hud.width = Math.round(cw * dpr); hud.height = Math.round(ch * dpr); g2.setTransform(hud.width / W, 0, 0, hud.height / H, 0, 0);
  if (renderer) { renderer.setPixelRatio(Math.min(dpr, cw * dpr > 900 ? 900 / cw : dpr)); renderer.setSize(cw, ch, false); }
}

let last = 0, clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now; clock += dt;
  const sc = Scenes.cur;
  sc.update(dt); Flash.update(dt); World.update(clock, dt);
  if (renderer) renderer.render(World.scene, World.camera);
  g2.save(); g2.clearRect(0, 0, W, H); sc.draw(g2); Flash.draw(g2); g2.restore();
  requestAnimationFrame(frame);
}

function boot() {
  try {
    renderer = new T.WebGLRenderer({ canvas: glCanvas, antialias: true });
  } catch (e) { fatal('この端末では 3D 表示（WebGL）を使えませんでした。別のブラウザでお試しください。'); return; }
  try {
    World.init(); State.loadBest(); State.reset(); Input.init(hud);
    window.addEventListener('resize', resize); if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
    resize();
    if (document.fonts && document.fonts.load) {
      const done = () => Labels.refresh();
      Promise.all([document.fonts.load('24px "Dela Gothic One"', '小倉貫通'), document.fonts.load('700 16px "Zen Kaku Gothic New"', '目標駅'), document.fonts.load('900 16px "Zen Kaku Gothic New"', '目標駅')]).then(done, done);
    }
    Scenes.go('title'); requestAnimationFrame(frame);
  } catch (e) { fatal('起動に失敗しました: ' + (e && e.message ? e.message : e)); }
}

window.__MONORAIL__ = { DATA, State, Scenes, Input, Judgement, World, Gauge };
boot();
})();
